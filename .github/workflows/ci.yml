name: Continuous Integration

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "**"

  pull_request:
    branches:
      - "**:**"

  release:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - run: shards install
      - run: timeout 5m make test

  h2spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1

      - run: make bin/server CRFLAGS=-Dh2spec
      - run: ./bin/server &

      - run: wget -O - "https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz" | tar zx -C bin
      - run: ./bin/h2spec --version
      - run: timeout 5m ./bin/h2spec --strict --port 9292 --insecure

  h2spec_tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1

      - run: make bin/server CRFLAGS=-Dh2spec
      - run: make ssl
      - run: TLS=1 ./bin/server &

      - run: curl -L "https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz" | tar zx -C bin
      - run: ./bin/h2spec --version
      - run: timeout 5m ./bin/h2spec --strict --port 9292 --tls --insecure

  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: sudo apt-get update && sudo apt-get install -y nghttp2-server
      - run: shards install
      - run: make ssl
      - run: mkdir -p bin && cd test/interop && go build -o ../../bin/interop-server .

      - run: mkdir -p /tmp/www && head -c 1024 /dev/urandom > /tmp/www/1k.bin && head -c 1048576 /dev/urandom > /tmp/www/1m.bin
      - run: nghttpd --no-tls -d /tmp/www 8080 &
      - run: nghttpd -d /tmp/www 8443 ssl/server.key ssl/server.crt &
      - run: ./bin/interop-server -h2c :9080 -tls :9443 &
      - run: for port in 8080 8443 9080 9443; do timeout 30 sh -c "until nc -z 127.0.0.1 $port; do sleep 1; done"; done

      - run: H2_INTEROP=1 timeout 5m crystal run test/interop/client_test.cr -- --chaos --parallel 4
